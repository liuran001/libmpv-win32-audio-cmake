name: verify libmpv audio-lite

# 在与目标架构一致的 Windows runner 上运行 mpv.exe：x86_64 用 windows-latest，
# aarch64 用 windows-11-arm（x64 runner 无法执行 ARM64 二进制）。
# 既被 audio-lite.yml 调用，也可手动指定已有 run 的产物单独复验。
on:
  workflow_call:
    inputs:
      bit: { type: string, required: true }
      run_id: { type: string, required: true }
  workflow_dispatch:
    inputs:
      bit: { description: 'x86_64 / aarch64', required: true, default: aarch64 }
      run_id: { description: 'audio-lite run id whose artifact to verify', required: true }

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.bit }} on Windows
    runs-on: ${{ inputs.bit == 'aarch64' && 'windows-11-arm' || 'windows-latest' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: libmpv-audio-lite-windows-${{ inputs.bit }}
          path: dl
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Extract
        shell: pwsh
        run: |
          7z x -y "dl\libmpv-audio-lite-windows-${{ inputs.bit }}.7z" -overify-out | Out-Null
          Get-ChildItem -Recurse verify-out | Select-Object FullName, Length | Format-Table -AutoSize

      - name: mpv --version and --af=help
        shell: pwsh
        run: |
          $mpv = (Get-ChildItem -Recurse verify-out -Filter mpv.exe | Select-Object -First 1).FullName
          "== mpv --version ==" | Set-Content version.txt
          & $mpv --version 2>&1 | Add-Content version.txt
          "" | Add-Content version.txt
          # mpv 0.35 没有 --list-filters；音频滤镜清单用 --af=help
          "== mpv --af=help ==" | Add-Content version.txt
          & $mpv --af=help 2>&1 | Add-Content version.txt
          "" | Add-Content version.txt
          "== mpv --vf=help (head) ==" | Add-Content version.txt
          & $mpv --vf=help 2>&1 | Select-Object -First 30 | Add-Content version.txt
          Get-Content version.txt
          exit 0

      - name: Runtime proof - combined lavfi chain must build and play
        shell: pwsh
        run: |
          $mpv = (Get-ChildItem -Recurse verify-out -Filter mpv.exe | Select-Object -First 1).FullName

          # 2 秒 440Hz 16bit PCM WAV
          $rate = 44100; $secs = 2; $n = $rate * $secs
          $bw = New-Object System.IO.BinaryWriter([System.IO.File]::Create("$PWD\tone.wav"))
          $dataLen = $n * 2
          $bw.Write([System.Text.Encoding]::ASCII.GetBytes("RIFF")); $bw.Write([int](36 + $dataLen))
          $bw.Write([System.Text.Encoding]::ASCII.GetBytes("WAVEfmt ")); $bw.Write([int]16)
          $bw.Write([int16]1); $bw.Write([int16]1); $bw.Write([int]$rate)
          $bw.Write([int]($rate * 2)); $bw.Write([int16]2); $bw.Write([int16]16)
          $bw.Write([System.Text.Encoding]::ASCII.GetBytes("data")); $bw.Write([int]$dataLen)
          for ($i = 0; $i -lt $n; $i++) { $bw.Write([int16](12000 * [math]::Sin(2 * [math]::PI * 440 * $i / $rate))) }
          $bw.Close()

          # 一条链覆盖 ADR-08 需要的全部能力：音量、音量均衡、均衡器、淡入、限幅、重采样
          $chain = 'volume=0.8,dynaudnorm,equalizer=f=1000:t=q:w=1:g=3,afade=t=in:d=0.1,alimiter,aresample=48000'
          $p = Start-Process -FilePath $mpv -Wait -PassThru -NoNewWindow `
                 -ArgumentList @('--no-config','--no-video','--ao=null','--length=0.5',"--af=lavfi=[$chain]","$PWD\tone.wav") `
                 -RedirectStandardOutput "$PWD\chain-stdout.txt" -RedirectStandardError "$PWD\chain-stderr.txt"
          "== combined lavfi chain ==" | Set-Content chain-report.txt
          "af=lavfi=[$chain]" | Add-Content chain-report.txt
          "exit=$($p.ExitCode)" | Add-Content chain-report.txt
          Get-Content "$PWD\chain-stderr.txt" -ErrorAction SilentlyContinue | Add-Content chain-report.txt
          Get-Content chain-report.txt
          if ($p.ExitCode -ne 0) { Write-Error "combined lavfi chain failed with exit $($p.ExitCode)" }
          exit 0
      - name: SHA-256 and sizes
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse verify-out -Include *.dll, *.exe
          foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}  {2} bytes" -f $h, $f.Name, $f.Length | Tee-Object -FilePath sha256.txt -Append
          }

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-audio-lite-windows-${{ inputs.bit }}-evidence
          path: |
            version.txt
            chain-report.txt
            chain-stderr.txt
            sha256.txt
          retention-days: 30
